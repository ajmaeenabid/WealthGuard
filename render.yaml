# Render Blueprint: one web service with a persistent disk for the SQLite database.
# A persistent disk needs a paid instance type (starter). Secrets are entered in the Render dashboard, never here.
services:
  - type: web
    name: wealthguard
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: wealthguard-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WEALTHGUARD_DB
        value: /var/data/wealthguard.db
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      - key: RECEIPT_KEY
        sync: false
