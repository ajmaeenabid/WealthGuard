# Render Blueprint (free plan): one web service, so every request reaches the same instance and sessions stay valid.
# Free instances have no persistent disk: the database lives in /tmp, resets on a redeploy, and the service sleeps after
# about 15 minutes idle (the first request then takes up to a minute). Demo users are re-created automatically.
# For permanent data: set plan to starter and add
#   disk: {name: wealthguard-data, mountPath: /var/data, sizeGB: 1}
# and set WEALTHGUARD_DB to /var/data/wealthguard.db.
# Secrets are entered in the Render dashboard, never here.
services:
  - type: web
    name: wealthguard-ajmaeenabid
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WEALTHGUARD_DB
        value: /tmp/wealthguard.db
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      - key: RECEIPT_KEY
        sync: false
