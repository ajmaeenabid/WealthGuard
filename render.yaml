# Render blueprint: free plan, one instance, database in /tmp
services:
  - type: web
    name: wealthguard-ajmaeenabid
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WEALTHGUARD_DB
        value: /tmp/wealthguard.db
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      - key: RECEIPT_KEY
        sync: false
